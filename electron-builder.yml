appId: com.ldelcampo.newsapp
productName: Atalia
directories:
  output: dist
afterPack: build/after-pack.cjs
files:
  - out/**
  - package.json
win:
  target: nsis
mac:
  # zip is what the auto-updater downloads; dmg is for the first install.
  target: [dmg, zip]
  # Signed with the Developer ID that CI imports into the keychain; otherwise
  # build/after-pack.cjs applies an ad-hoc signature.
  category: public.app-category.productivity
  # No spaces, so the names GitHub gives uploaded files match latest-mac.yml.
  artifactName: Atalia-${version}-${arch}-mac.${ext}
linux:
  target: AppImage
  category: Office
publish:
  provider: github
  owner: ldelcampo
  repo: newsapp
  releaseType: prerelease
