appId: com.ldelcampo.newsapp
productName: Information Hub
directories:
  output: dist
afterPack: build/after-pack.cjs
files:
  - out/**
  - package.json
win:
  target: nsis
mac:
  target: dmg
  # Signed with the Developer ID that CI imports into the keychain; otherwise
  # build/after-pack.cjs applies an ad-hoc signature.
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
