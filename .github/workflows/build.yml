name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer
        shell: bash
        env:
          # Developer ID signing and notarization apply to macOS only, and only
          # when the signing secrets exist (they are absent on fork PRs).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder skips signing on pull requests unless told otherwise.
          # Safe here: secrets are never passed to fork PRs.
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          set -o pipefail
          if [ -n "$CSC_LINK" ]; then
            echo "Signing with Developer ID and notarizing"
            cmd="npm run dist -- -c.mac.notarize=true -c.forceCodeSigning=true"
          else
            echo "No signing certificate: unsigned (Windows/Linux) or ad-hoc (macOS)"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            cmd="npm run dist"
          fi
          if ! $cmd 2>&1 | tee build.log; then
            # Surface the cause as an annotation; secrets are masked by Actions.
            echo "::error::Installer build failed: $(grep -iE 'error|⨯|fail|sign|notar|identity' build.log | tail -15 | tr '\n' ' ' | cut -c1-3000)"
            exit 1
          fi
      - name: Check macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          app=$(ls -d dist/mac*/*.app | head -1)
          check() {
            if ! out=$("$@" 2>&1); then
              echo "::error::$1 failed: $(echo "$out" | tr '\n' ' ')"
              exit 1
            fi
            echo "$out"
          }
          check codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$SIGNED" = "true" ]; then
            check spctl --assess --type execute --verbose=4 "$app"
            check xcrun stapler validate "$app"
            echo "::notice::$(codesign -dv "$app" 2>&1 | grep -E '^Authority=Developer ID Application' | head -1)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
